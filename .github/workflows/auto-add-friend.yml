name: Auto Add Friend Link

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  add-friend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # 直接解析 Issue 内容（不使用第三方 Action）
      - name: Parse issue form data
        id: parse
        run: |
          body="${{ github.event.issue.body }}"
          extract() {
            echo "$body" | awk -v title="$1" 'BEGIN{found=0} {if(found){print;exit}} if($0~title){found=1}' | sed 's/^[ \t]*//g'
          }
          echo "name=$(extract "网站名称")" >> $GITHUB_OUTPUT
          echo "imgurl=$(extract "头像 / Logo 地址")" >> $GITHUB_OUTPUT
          echo "desc=$(extract "网站描述")" >> $GITHUB_OUTPUT
          echo "siteurl=$(extract "网站地址")" >> $GITHUB_OUTPUT
          echo "tags=$(extract "标签")" >> $GITHUB_OUTPUT

      # 生成友链条目
      - name: Update friends.ts
        run: |
          NAME="${{ steps.parse.outputs.name }}"
          IMGURL="${{ steps.parse.outputs.imgurl }}"
          DESC="${{ steps.parse.outputs.desc }}"
          SITEURL="${{ steps.parse.outputs.siteurl }}"
          TAGS="${{ steps.parse.outputs.tags }}"

          # 格式化标签
          TAGS_ARR=$(echo "$TAGS" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | xargs -I {} echo '"{}"' | paste -sd "," -)
          TAGS_ARR="[${TAGS_ARR}]"

          FILE=src/data/friends.ts

          # 自动 ID 自增
          MAX_ID=$(grep -oP 'id:\s*\K\d+' $FILE | sort -n | tail -1)
          if [ -z "$MAX_ID" ]; then NEW_ID=1; else NEW_ID=$((MAX_ID + 1)); fi

          # 生成新条目
          NEW_ITEM="	{
		id: $NEW_ID,
		title: \"$NAME\",
		imgurl: \"$IMGURL\",
		desc: \"$DESC\",
		siteurl: \"$SITEURL\",
		tags: $TAGS_ARR,
	},"

          # 插入到 friendsData 数组
          awk -v item="$NEW_ITEM" '
            /export const friendsData/ { print; in_array=1; next }
            in_array && /^\];/ { print item; print "]"; in_array=0; next }
            { print }
          ' $FILE > tmp && mv tmp $FILE

      # 提交到仓库
      - name: Commit and push
        uses: EndBug/add-and-commit@v9
        with:
          message: "✅ Auto add friend: ${{ steps.parse.outputs.name }}"
          committer_name: GitHub Actions
          committer_email:actions@github.com
          add: src/data/friends.ts

      # 回复并关闭 Issue
      - name: Reply and close issue
        uses: peter-evans/close-issue@v3
        with:
          comment: |
            ✅ **友链已自动添加成功！**
            已写入：src/data/friends.ts
            自动 ID：${{ steps.parse.outputs.id }}
            部署后生效～