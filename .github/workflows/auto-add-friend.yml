name: Auto Add Friend

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  add-friend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Parse Issue Data
        id: parse
        run: |
          body="${{ github.event.issue.body }}"
          get() {
            echo "$body" | grep -A1 "$1:" | tail -n1 | sed 's/^[ \t]*//g'
          }
          NAME=$(get "网站名称")
          IMGURL=$(get "头像 / Logo 地址")
          DESC=$(get "网站描述")
          SITEURL=$(get "网站地址")
          TAGS=$(get "标签")
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "imgurl=$IMGURL" >> $GITHUB_OUTPUT
          echo "desc=$DESC" >> $GITHUB_OUTPUT
          echo "siteurl=$SITEURL" >> $GITHUB_OUTPUT
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Update friends.ts
        run: |
          NAME="${{ steps.parse.outputs.name }}"
          IMGURL="${{ steps.parse.outputs.imgurl }}"
          DESC="${{ steps.parse.outputs.desc }}"
          SITEURL="${{ steps.parse.outputs.siteurl }}"
          TAGS="${{ steps.parse.outputs.tags }}"

          TAGS_JSON=$(echo "$TAGS" | tr ',' '\n' | sed 's/^ *//g' | jq -R . | jq -s .)
          FILE="src/data/friends.ts"

          MAX_ID=$(grep -oP 'id:\s*\K\d+' $FILE | sort -n | tail -1)
          NEW_ID=$(( ${MAX_ID:-0} + 1 ))

          NEW_ITEM="	{
		id: $NEW_ID,
		title: \"$NAME\",
		imgurl: \"$IMGURL\",
		desc: \"$DESC\",
		siteurl: \"$SITEURL\",
		tags: $TAGS_JSON,
	},"

          awk -v n="$NEW_ITEM" '
            /export const friendsData/ {print; inlist=1; next}
            inlist && /^\];/ {print n; print "]"; inlist=0; next}
            {print}
          ' $FILE > tmp && mv tmp $FILE

      - name: Commit
        uses: EndBug/add-and-commit@v9
        with:
          message: "feat: add friend ${{ steps.parse.outputs.name }}"
          committer_name: GitHub Actions
          committer_email: actions@github.com
          add: src/data/friends.ts

      - name: Reply & Close
        uses: peter-evans/close-issue@v3
        with:
          comment: |
            ✅ 友链已自动添加成功！
            已写入：src/data/friends.ts
            部署后生效～