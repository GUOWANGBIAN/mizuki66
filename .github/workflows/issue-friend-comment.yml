name: Auto Friend Comment
on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  comment:
    if: contains(github.event.issue.labels.*.name, '友链')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Generate friend code with auto ID
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'src/data/friends.ts';
            const content = fs.readFileSync(path, 'utf8');

            // 自动获取当前最大 ID
            const ids = content.match(/id:\s*(\d+)/g) || [];
            const maxId = ids.length === 0 ? 0 : Math.max(...ids.map(i => parseInt(i.match(/\d+/)[0])));
            const newId = maxId + 1;

            // 解析 Issue 表单
            const body = context.payload.issue.body;

            function get(label) {
              const reg = new RegExp(`${label}\\s*[\\s\\S]*?^\\s*(.+)`, 'm');
              const match = body.match(reg);
              return match ? match[1].trim() : '';
            }

            const title = get('网站名称');
            const imgurl = get('头像 / Logo 地址');
            const desc = get('网站描述');
            const siteurl = get('网站地址');
            const tags = get('标签').split(',').map(t => `"${t.trim()}"`).join(', ');

            // 输出你要的代码
            const code = `{
  id: ${newId},
  title: "${title}",
  imgurl: "${imgurl}",
  desc: "${desc}",
  siteurl: "${siteurl}",
  tags: [${tags}],
},`;

            // 回复 Issue
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ **友链代码已自动生成（ID 已自增）**\n\`\`\`ts\n${code}\n\`\`\``
            });