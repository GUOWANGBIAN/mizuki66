name: Deploy Blog
on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /www/wwwroot/mizuki66
            git fetch origin
            git reset --hard origin/master
            git clean -fd
            chmod -R 755 /www/wwwroot/mizuki66
            umask 022
            pnpm install
            pnpm build
            pnpm run submit
            chown -R www:www .
            find . -type d -exec chmod 755 {} \;
            find . -type f -exec chmod 644 {} \;
